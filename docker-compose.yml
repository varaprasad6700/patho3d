services:
  patho3d:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-github-username/patho3d}:latest
    container_name: patho3d-atlas
    restart: unless-stopped
    pull_policy: always
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_network:
    name: ${DOCKER_NETWORK:-proxy}
    external: true
